name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests benchmarks scripts
      - run: ruff format --check src tests benchmarks scripts
      - run: pytest --cov=apixly_jev_harness
      - run: python benchmarks/parameters.py --output local-results/parameter-ab.json
      - run: python benchmarks/progress.py --output local-results/evidence-progress-ab.json
      - run: python benchmarks/diagnostics.py --output local-results/decision-diagnostics-ab.json
      - run: python benchmarks/tool_choice.py --output local-results/tool-choice-offline-ab.json
      - run: python benchmarks/static_check.py --output local-results/static-check-ab.json
      - run: python benchmarks/run_preflight.py --output local-results/run-preflight-ab.json
      - run: python -m build
      - run: python scripts/check_public.py
      - run: python scripts/build_site.py
