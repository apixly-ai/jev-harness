<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="630" viewBox="0 0 1440 630" role="img" aria-labelledby="title desc">
    <title id="title">从目标到可验证结果</title><desc id="desc">主模型规划，程序观察并提供候选，Jev 选择，程序执行并独立验证。</desc>
    <defs>
      <radialGradient id="glow"><stop stop-color="#c6f67a" stop-opacity=".075"/><stop offset="1" stop-color="#080b0f" stop-opacity="0"/></radialGradient>
      <linearGradient id="edge"><stop stop-color="#c6f67a"/><stop offset="1" stop-color="#7de3e5"/></linearGradient>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#64715f" stroke-width="1.6"/></marker>
    </defs>
    <style>text{font-family:Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, sans-serif}.mono{font-family:SFMono-Regular, Consolas, Liberation Mono, monospace}</style>
    <rect width="1440" height="630" rx="28" fill="#080b0f"/>
    <ellipse cx="1123.2" cy="157.5" rx="503.99999999999994" ry="441.0" fill="url(#glow)"/>
    <path d="M32 .5H1408" stroke="#2b3426"/>
    <g transform="translate(63 43) scale(0.55)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 29V10h28" stroke="#c6f67a"/><path d="m31 3 8 7-8 7" stroke="#c6f67a"/>
      <path d="M53 10h19v28" stroke="#7de3e5"/><path d="m79 31-7 8-7-8" stroke="#7de3e5"/>
      <path d="M72 53v19H44" stroke="#c6f67a"/><path d="m51 79-8-7 8-7" stroke="#c6f67a"/>
      <path d="M29 72H10V44" stroke="#7de3e5"/><path d="m3 51 7-8 7 8" stroke="#7de3e5"/>
      <circle cx="41" cy="41" r="3" fill="#eef0eb" stroke="none"/>
    </g><text x="127" y="82" font-size="25" font-weight="600" fill="#eef0eb" class="" >jev-harness</text><text x="64" y="151" font-size="46" font-weight="650" fill="#eef0eb" class="" letter-spacing="-1.5">从目标到可验证结果</text><text x="64" y="197" font-size="22" font-weight="400" fill="#a3aaa5" class="" >规划留给主模型，选择交给 Jev，执行与证明由程序负责。</text><rect x="64" y="255" width="301" height="204" rx="16" fill="#10171d" stroke="#2a333b"/><text x="86" y="290" font-size="12" font-weight="650" fill="#7de3e5" class="mono" letter-spacing="1">01  PROGRAM</text><text x="86" y="343" font-size="30" font-weight="650" fill="#eef0eb" class="" >观察</text><text x="86" y="388" font-size="17" font-weight="400" fill="#a3aaa5" class="" >当前状态</text><text x="86" y="418" font-size="17" font-weight="400" fill="#a3aaa5" class="" >工具与参数候选</text><path d="M373 357h20" stroke="#637259" stroke-width="2" marker-end="url(#arrow)"/><rect x="401" y="255" width="301" height="204" rx="16" fill="#152010" stroke="#486434"/><text x="423" y="290" font-size="12" font-weight="650" fill="#c6f67a" class="mono" letter-spacing="1">02  JEV</text><text x="423" y="343" font-size="30" font-weight="650" fill="#eef0eb" class="" >选择</text><text x="423" y="388" font-size="17" font-weight="400" fill="#a3aaa5" class="" >已有工具与类型化选项</text><text x="423" y="418" font-size="17" font-weight="400" fill="#a3aaa5" class="" >选择下一步</text><path d="M710 357h20" stroke="#637259" stroke-width="2" marker-end="url(#arrow)"/><rect x="738" y="255" width="301" height="204" rx="16" fill="#10171d" stroke="#2a333b"/><text x="760" y="290" font-size="12" font-weight="650" fill="#7de3e5" class="mono" letter-spacing="1">03  PROGRAM</text><text x="760" y="343" font-size="30" font-weight="650" fill="#eef0eb" class="" >执行</text><text x="760" y="388" font-size="17" font-weight="400" fill="#a3aaa5" class="" >检查边界与新鲜度</text><text x="760" y="418" font-size="17" font-weight="400" fill="#a3aaa5" class="" >调用已注册工具</text><path d="M1047 357h20" stroke="#637259" stroke-width="2" marker-end="url(#arrow)"/><rect x="1075" y="255" width="301" height="204" rx="16" fill="#10171d" stroke="#2a333b"/><text x="1097" y="290" font-size="12" font-weight="650" fill="#c6f67a" class="mono" letter-spacing="1">04  PROGRAM</text><text x="1097" y="343" font-size="30" font-weight="650" fill="#eef0eb" class="" >验证</text><text x="1097" y="388" font-size="17" font-weight="400" fill="#a3aaa5" class="" >获取新的观察</text><text x="1097" y="418" font-size="17" font-weight="400" fill="#a3aaa5" class="" >独立核对目标结果</text><path d="M1228 478v44H214v-44" stroke="#34422c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="549" y="502" width="344" height="38" rx="19" fill="#080b0f" stroke="#2b3725"/><text x="571" y="527" font-size="14" font-weight="500" fill="#c6f67a" class="" >未完成？用新观察继续循环</text><text x="64" y="588" font-size="18" font-weight="400" fill="#8c968d" class="" >程序给出候选；模型不会生成可执行代码。</text></svg>
