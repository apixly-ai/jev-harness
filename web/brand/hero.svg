    </g><text x="145" y="105" font-size="34" font-weight="650" fill="#eef0eb" class="" >jev-harness</text><text x="69" y="182" font-size="14" font-weight="650" fill="#c6f67a" class="mono" letter-spacing="2">JEV-NATIVE AGENT LOOPS</text><text x="65" y="285" font-size="83" font-weight="750" fill="#eef0eb" class="" letter-spacing="-3">Your tools.</text><text x="65" y="390" font-size="76" font-weight="750" fill="#c6f67a" class="" letter-spacing="-3">Jev’s next move.</text><text x="69" y="458" font-size="21" font-weight="400" fill="#a3aaa5" class="" >Let Jev choose from the choices you supply.</text><text x="69" y="495" font-size="21" font-weight="400" fill="#a3aaa5" class="" >Your program acts. A fresh check proves the result.</text><rect x="69" y="548" width="237" height="47" rx="23.5" fill="#151c11" stroke="#34442b"/><text x="93" y="579" font-size="16" font-weight="600" fill="#c6f67a" class="" >Define → run → verify</text><text x="325" y="579" font-size="16" font-weight="400" fill="#8b948c" class="" >Keep the trace. Know the outcome.</text><rect x="866" y="145" width="505" height="481" rx="22" fill="#0f1419" stroke="#273039"/><text x="893" y="184" font-size="12" font-weight="600" fill="#a0aa9f" class="mono" letter-spacing="1.5">ONE BOUNDED LOOP</text><path d="M1319 541h23V238h-23" stroke="#34412e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="891" y="207" width="425" height="75" rx="12" fill="#141b21" stroke="#273039"/><text x="910" y="237" font-size="14" font-weight="600" fill="#7de3e5" class="mono" >01</text><text x="951" y="237" font-size="22" font-weight="600" fill="#eef0eb" class="" >Observe</text><text x="951" y="262" font-size="14" font-weight="400" fill="#99a49b" class="" >Your program reads the state</text><path d="M1103 285v11" stroke="#53604e" stroke-width="2" marker-end="url(#arrow)"/><rect x="891" y="299" width="425" height="75" rx="12" fill="#162012" stroke="#486434"/><text x="910" y="329" font-size="14" font-weight="600" fill="#c6f67a" class="mono" >02</text><text x="951" y="329" font-size="22" font-weight="600" fill="#eef0eb" class="" >Choose</text><text x="951" y="354" font-size="14" font-weight="400" fill="#99a49b" class="" >Jev picks a tool and typed choices</text><path d="M1103 377v11" stroke="#53604e" stroke-width="2" marker-end="url(#arrow)"/><rect x="891" y="391" width="425" height="75" rx="12" fill="#141b21" stroke="#273039"/><text x="910" y="421" font-size="14" font-weight="600" fill="#7de3e5" class="mono" >03</text><text x="951" y="421" font-size="22" font-weight="600" fill="#eef0eb" class="" >Execute</text><text x="951" y="446" font-size="14" font-weight="400" fill="#99a49b" class="" >Your program checks and calls</text><path d="M1103 469v11" stroke="#53604e" stroke-width="2" marker-end="url(#arrow)"/><rect x="891" y="483" width="425" height="75" rx="12" fill="#141b21" stroke="#273039"/><text x="910" y="513" font-size="14" font-weight="600" fill="#c6f67a" class="mono" >04</text><text x="951" y="513" font-size="22" font-weight="600" fill="#eef0eb" class="" >Verify</text><text x="951" y="538" font-size="14" font-weight="400" fill="#99a49b" class="" >A fresh observation checks the goal</text><circle cx="905" cy="598" r="4" fill="#c6f67a"/><text x="918" y="603" font-size="13" font-weight="500" fill="#a8b29d" class="mono" >Done = independently verified</text><path d="M69 690H1371" stroke="#273039"/><text x="69" y="745" font-size="26" font-weight="600" fill="#eef0eb" class="" >Python</text><text x="69" y="780" font-size="17" font-weight="400" fill="#8c968d" class="" >Fits your own tools</text><text x="523" y="745" font-size="26" font-weight="600" fill="#eef0eb" class="" >Typed choices</text><text x="523" y="780" font-size="17" font-weight="400" fill="#8c968d" class="" >Supplied by your program</text><text x="974" y="745" font-size="26" font-weight="600" fill="#eef0eb" class="" >Independent checks</text><text x="974" y="780" font-size="17" font-weight="400" fill="#8c968d" class="" >Outcomes and unknowns stay visible</text><path d="M467 725v55M918 725v55" stroke="#273039"/></svg>
